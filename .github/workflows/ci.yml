name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check translations
        run: node scripts/i18n-check.mjs

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # Runs `test:coverage` in every @chativa/* package that defines it.
      # Each package enforces its own thresholds (vitest.config.ts →
      # coverage.thresholds); a package that drops below them exits non-zero
      # and fails this job. --no-bail lets every package report first.
      - name: Run tests with coverage
        run: pnpm test:coverage

      # Per-package + weighted total table in the job summary. Runs even when
      # thresholds failed so the numbers are visible on the failing run.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('packages/*/coverage/coverage-summary.json') != '' }}
        run: pnpm coverage:summary

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('packages/*/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: warn
          retention-days: 14

      # Aggregates every packages/*/coverage/coverage-summary.json, weighted
      # by line totals (covered lines / total lines across all packages).
      - name: Update coverage badge in README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/coverage-summary.mjs --badge

      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: update coverage badge [skip ci]"
          )
          git push
