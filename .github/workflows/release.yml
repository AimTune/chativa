name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: pnpm -r exec npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      # Publish in dependency order. Versions already on npm are skipped, so a
      # failed release can be re-run without tripping over the packages that
      # went out the first time.
      - name: Publish packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for pkg in core \
                     connector-dummy connector-websocket connector-signalr \
                     connector-directline connector-mekik connector-converger \
                     connector-http connector-sse \
                     genui ui \
                     react rn-webview vue vue2 angular svelte; do
            name="@chativa/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on npm, skipping"
              continue
            fi
            (cd "packages/$pkg" && pnpm publish --access public --no-git-checks)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
