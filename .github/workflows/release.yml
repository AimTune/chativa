name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: pnpm -r exec npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Publish @chativa/core
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/core
      - name: Publish @chativa/connector-dummy
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-dummy
      - name: Publish @chativa/connector-websocket
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-websocket
      - name: Publish @chativa/connector-signalr
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-signalr
      - name: Publish @chativa/connector-directline
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-directline
      - name: Publish @chativa/connector-mekik
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-mekik
      - name: Publish @chativa/connector-http
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-http
      - name: Publish @chativa/connector-sse
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/connector-sse
      - name: Publish @chativa/genui
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/genui
      - name: Publish @chativa/ui
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/ui
      - name: Publish @chativa/react
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/react
      - name: Publish @chativa/rn-webview
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/rn-webview
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
