name: Deploy site (docs + sandbox) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel in-progress if a new one starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (core, ui, genui, connectors)
        run: pnpm build

      - name: Build sandbox at /sandbox
        run: pnpm --filter sandbox build
        env:
          VITE_BASE: /sandbox/

      - name: Build Docusaurus site
        run: pnpm --filter website build

      - name: Combine sandbox + schemas into docs build
        run: |
          mkdir -p website/build/sandbox
          cp -R apps/sandbox/dist/. website/build/sandbox/
          # Publish JSON schemas at /schemas/* so the $id URLs resolve.
          mkdir -p website/build/schemas
          cp -R schemas/. website/build/schemas/
          # Ensure GitHub Pages does not strip the _next-style underscore-prefixed directories.
          touch website/build/.nojekyll

      - name: Verify og:image targets exist in build
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          const root="website/build";
          const files=[];
          (function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?walk(p):/\.html$/.test(p)&&files.push(p);}})(root);
          const missing=[];
          for(const f of files){
            const s=fs.readFileSync(f,"utf8");
            for(const tag of s.matchAll(/<meta\b[^>]*>/g)){
              const t=tag[0];
              if(!/og:image|twitter:image/.test(t))continue;
              const c=t.match(/content="([^"]+)"/);
              if(!c)continue;
              const rel=c[1].replace(/^https?:\/\/[^/]+/,"").replace(/^\//,"");
              if(!fs.existsSync(path.join(root,rel)))missing.push(f+" -> "+c[1]);
            }
          }
          if(missing.length){console.error("MISSING og:image/twitter:image targets:\n"+missing.join("\n"));process.exit(1);}
          console.log("OK: all og:image/twitter:image targets resolve in build/");
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
